name: Backfill release

# Jalur khusus untuk menerbitkan rilis dari commit yang BUKAN kepala main
# (mis. versi yang sudah terlanjur naik dua kali sebelum sempat di-tag).
# Rilis normal tetap lewat tag pada alur "CI Lumi Transport".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi tanpa huruf v, mis. 2.12"
        required: true
      ref:
        description: "Commit SHA atau tag yang dibangun"
        required: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan alat build Android
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT="$ANDROID_HOME/platforms/android-35"
          if [ ! -f "$PLAT/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" >/dev/null 2>&1 || true
          fi
          mkdir -p tools/sdk
          curl -sSL -o tools/sdk/ecj.jar https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar
          echo "f7686c4960cf70c2ebc5c500a73a8cfc04541b730c18f1c5c21329889b137f45  tools/sdk/ecj.jar" | sha256sum -c -
          {
            echo "ANDROID_JAR=$PLAT/android.jar"
            echo "AAPT2=$BT/aapt2"
            echo "D8_JAR=$BT/lib/d8.jar"
            echo "APKSIGNER_JAR=$BT/lib/apksigner.jar"
            echo "ECJ_JAR=$PWD/tools/sdk/ecj.jar"
          } >> "$GITHUB_ENV"

      - name: Ambil kunci tanda tangan
        env:
          KS_B64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ]; then
            echo "::warning::Secrets LUMI_* belum diisi; APK ditandatangani kunci sementara."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lumi.keystore"
          {
            echo "KEYSTORE=$RUNNER_TEMP/lumi.keystore"
            echo "KS_PASS=$KS_PASS"
            echo "KS_ALIAS=${KS_ALIAS:-lumi}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          # Commit lama memakai build.sh; sejak 2.13.4 APK hanya dibangun lewat Gradle.
          if [ -f build.sh ]; then
            chmod +x build.sh
            ./build.sh
          else
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease
            mkdir -p build
            cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "build/LumiTransport-v${{ inputs.version }}.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ inputs.version }}
          path: build/LumiTransport-v*.apk
          if-no-files-found: error

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ inputs.ref }}
          name: "Lumi Transport v${{ inputs.version }}"
          body_path: release-notes/v${{ inputs.version }}.md
          files: build/LumiTransport-v${{ inputs.version }}.apk
          make_latest: "false"
