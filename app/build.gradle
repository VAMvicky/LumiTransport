plugins {
    alias(libs.plugins.android.application)
}

// Satu sumber versi: release-notes/CURRENT (dihitung juga oleh tools/version.sh).
def currentVersion = { ->
    new File(rootProject.projectDir, "release-notes/CURRENT").text.trim().replaceFirst("^v", "")
}
def versionCodeOf = { ->
    def p = currentVersion().split("\\.")
    int major = p.length > 0 ? (p[0] as int) : 0
    int minor = p.length > 1 ? (p[1] as int) : 0
    int patch = p.length > 2 ? (p[2] as int) : 0
    return major * 10000 + minor * 100 + patch
}

android {
    namespace "id.lumi.transport"
    compileSdk 34

    defaultConfig {
        applicationId "id.lumi.transport"
        minSdk 26
        targetSdk 34
        versionCode versionCodeOf()
        versionName currentVersion()
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE")
            if (ksPath != null && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KS_PASS")
                keyAlias(System.getenv("KS_ALIAS") ?: "lumi")
                keyPassword(System.getenv("KS_PASS"))
            }
        }
    }

    buildTypes {
        release {
            // R8 + resource shrinking: dibutuhkan supaya APK tidak membawa kode/aset mati.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            def ksPath = System.getenv("KEYSTORE")
            if (ksPath != null && new File(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress "woff2"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation libs.androidx.profileinstaller
}

// Bangun ulang data rute sebelum build (butuh python3).
tasks.register("buildRouteData", Exec) {
    workingDir rootProject.projectDir
    commandLine "python3", "tools/build_data.py"
}
preBuild.dependsOn buildRouteData
