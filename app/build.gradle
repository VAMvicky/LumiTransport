plugins {
    id "com.android.application"
}

// Satu sumber versi: release-notes/CURRENT (mis. "2.0", "2.1", "2.1.1").
// versionCode deterministik: 2.0 -> 20000, 2.1 -> 20100, 2.1.1 -> 20101.
def currentVersion = { ->
    new File(rootProject.projectDir, "release-notes/CURRENT").text.trim().replaceFirst("^v", "")
}
def versionCodeOf = { ->
    def p = currentVersion().split("\\.")
    int major = p.length > 0 ? (p[0] as int) : 0
    int minor = p.length > 1 ? (p[1] as int) : 0
    int patch = p.length > 2 ? (p[2] as int) : 0
    return major * 10000 + minor * 100 + patch
}

android {
    namespace "id.lumi.transport"
    compileSdk 34

    defaultConfig {
        applicationId "id.lumi.transport"
        minSdk 26
        targetSdk 34
        versionCode versionCodeOf()
        versionName currentVersion()
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ganti dengan signingConfig milikmu sebelum rilis ke Play Store.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources {
        noCompress "woff2"
    }
}

// Bangun ulang data rute sebelum build (butuh python3).
tasks.register("buildRouteData", Exec) {
    workingDir rootProject.projectDir
    commandLine "python3", "tools/build_data.py"
}
preBuild.dependsOn buildRouteData
